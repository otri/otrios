<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101c29"><title>OTriOS · Dashboard</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="screen" aria-label="Shared dashboard"><canvas tabindex="-1" id="view" width="1280" height="800" aria-label="Loading shared dashboard"></canvas><div id="controls" aria-label="Dashboard controls"></div><p id="error" role="alert" hidden></p><p class="sr-only"><i id="connection-dot"></i><span id="connection" role="status">Starting your space…</span></p><span class="sr-only" id="revision">Loading shared view</span><button id="monitoring-signout" class="auth-button" hidden>Sign out</button><dialog id="monitoring-login" aria-labelledby="login-title"><form id="monitoring-form"><h1 id="login-title">Sign in to Monitoring</h1><p>The demos are public. Infrastructure monitoring is private.</p><label>Email<input name="username" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert"></p><div class="auth-actions"><button type="button" id="login-back">Back to demos</button><button type="submit" id="login-submit">Sign in</button></div></form></dialog></main><script type="module" src="/app.js"></script></body></html>

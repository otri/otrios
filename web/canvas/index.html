<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171b20"><title>OTriOS · Dashboard</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="screen" aria-label="Shared dashboard"><canvas tabindex="-1" id="view" width="1280" height="800" aria-label="Loading shared dashboard"></canvas><div id="controls" aria-label="Dashboard controls"></div><div class="sr-only" id="chat-log" role="log" aria-label="Chat messages" aria-live="polite" aria-relevant="additions"></div><p id="error" role="alert" hidden></p><p class="sr-only"><i id="connection-dot"></i><span id="connection" role="status">Starting your space…</span></p><span class="sr-only" id="revision">Loading shared view</span><dialog id="monitoring-login" aria-labelledby="login-title"><form id="monitoring-form"><h1 id="login-title">Sign in</h1><p>Sign in to open this app.</p><label>Email<input name="username" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert"></p><div class="auth-actions"><button type="button" id="login-back">Back</button><button type="submit" id="login-submit">Sign in</button></div></form></dialog></main><script type="module" src="/app.js"></script></body></html>

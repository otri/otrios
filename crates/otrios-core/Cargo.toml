[package]
name = "otrios-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "LGPL-3.0-only"

[dependencies]
otrios-interfaces = { path = "../otrios-interfaces" }

[features]
default = []
dashboard = ["otrios-interfaces/layout", "dep:automerge", "dep:flexbuffers", "dep:sha2", "dep:font8x8"]

[dependencies.automerge]
version = "=0.12.0"
optional = true

[dependencies.flexbuffers]
version = "=25.12.19"
optional = true

[dependencies.sha2]
version = "=0.11.1"
optional = true

[dependencies.font8x8]
version = "=0.3.1"
optional = true

[lints]
workspace = true

# SPDX-License-Identifier: Apache-2.0
[package]
name = "otrios-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "LGPL-3.0-only"

[dependencies]
otrios-interfaces = { path = "../otrios-interfaces" }

[features]
canvas = ["dashboard", "merkle", "dep:wasmi", "dep:getrandom", "dep:serde", "dep:lz4_flex"]
signed-bundles = ["canvas", "dep:ring", "dep:base64"]
merkle = ["dep:sha2"]
default = []
dashboard = ["otrios-interfaces/layout", "dep:flexbuffers", "dep:sha2", "dep:unicode-segmentation", "dep:ruzstd"]

[dependencies.flexbuffers]
version = "=25.12.19"
optional = true

[dependencies.sha2]
version = "=0.11.1"
optional = true

[dependencies.ruzstd]
version = "=0.8.2"
optional = true

[lints]
workspace = true

[dependencies.unicode-segmentation]
version = "=1.13.3"
optional = true

[[example]]
name = "merkle_hash_cost"
required-features = ["dashboard"]

[dependencies.wasmi]
version = "=1.1.0"
default-features = false
features = ["std"]
optional = true

[dev-dependencies]
wat = "=1.239.0"
serde_json = "=1.0.154"

[[example]]
name = "merkle_tree_cost"
required-features = ["merkle"]

[dependencies.getrandom]
version = "=0.4.3"
optional = true

[dependencies.serde]
version = "=1.0.229"
features = ["derive"]
optional = true

[[example]]
name = "canvas_wire_cost"
required-features = ["canvas"]

[[example]]
name = "canvas_delta_breakdown"
required-features = ["canvas"]

[[example]]
name = "merkle_coverage_cost"
required-features = ["merkle"]

[[example]]
name = "canvas_readonly_cost"
required-features = ["canvas"]

[dependencies.lz4_flex]
version = "=0.14.0"
default-features = false
features = ["std", "safe-encode", "safe-decode", "checked-decode"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ring]
version = "=0.17.14"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.base64]
version = "=0.22.1"
optional = true

[[example]]
name = "text_scroll_frames"
required-features = ["canvas"]

[[example]]
name = "document_cost"
required-features = ["canvas"]

[[example]]
name = "document_frames"
required-features = ["canvas"]

[[example]]
name = "collection_cost"
required-features = ["merkle"]

[[example]]
name = "chat_window_fixture"
required-features = ["canvas"]

[[example]]
name = "message_frames"
required-features = ["canvas"]

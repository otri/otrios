# SPDX-License-Identifier: Apache-2.0
[package]
name = "otrios-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "LGPL-3.0-only"

[dependencies]
otrios-interfaces = { path = "../otrios-interfaces" }

[features]
canvas = ["dashboard", "dep:wasmi"]
merkle = ["dep:sha2"]
default = []
dashboard = ["otrios-interfaces/layout", "dep:automerge", "dep:flexbuffers", "dep:sha2", "dep:unicode-segmentation", "dep:ruzstd"]

[dependencies.automerge]
version = "=0.12.0"
optional = true

[dependencies.flexbuffers]
version = "=25.12.19"
optional = true

[dependencies.sha2]
version = "=0.11.1"
optional = true

[dependencies.ruzstd]
version = "=0.8.2"
optional = true

[lints]
workspace = true

[dependencies.unicode-segmentation]
version = "=1.13.3"
optional = true

[[example]]
name = "merkle_hash_cost"
required-features = ["dashboard"]

[dependencies.wasmi]
version = "=1.1.0"
default-features = false
features = ["std"]
optional = true

[dev-dependencies]
wat = "=1.239.0"

[[example]]
name = "merkle_tree_cost"
required-features = ["merkle"]

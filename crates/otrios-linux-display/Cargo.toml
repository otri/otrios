# SPDX-License-Identifier: Apache-2.0
[package]
name = "otrios-linux-display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[features]
default = []
platform = []

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[dev-dependencies]
otrios-core = { path = "../otrios-core", features = ["dashboard"] }

[[example]]
name = "text_scroll_probe"
required-features = ["platform"]

[[example]]
name = "text_pixel_probe"
required-features = ["platform"]

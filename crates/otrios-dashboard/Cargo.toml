# SPDX-License-Identifier: Apache-2.0
[package]
name = "otrios-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[features]
canvas = ["otrios-core/canvas", "dep:wat"]
default = []
host-sync = ["dep:tungstenite", "dep:serde_json", "dep:rustls"]
direct = ["host-sync", "otrios-core/canvas", "dep:otrios-linux-display"]
server = ["otrios-core/canvas", "dep:axum", "dep:tokio", "dep:serde_json", "dep:futures-util", "dep:argon2", "dep:getrandom", "dep:sha2"]

[dependencies]
otrios-core = { path = "../otrios-core", features = ["dashboard"] }
otrios-interfaces = { path = "../otrios-interfaces", features = ["release"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
otrios-linux-display = { path = "../otrios-linux-display", features = ["platform"], optional = true }
wat = { version = "=1.239.0", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
axum = { version = "=0.8.9", features = ["ws"], optional = true }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
argon2 = { version = "=0.5.3", optional = true }
getrandom = { version = "=0.4.3", optional = true }
sha2 = { version = "=0.11.1", optional = true }
futures-util = { version = "=0.3.34", features = ["sink"], optional = true }

[[bin]]
name = "dashboard-server"
path = "src/server.rs"
required-features = ["server"]

[dev-dependencies]
tungstenite = "=0.30.0"

[lints]
workspace = true

[[bin]]
name = "dashboard-monitoring"
path = "src/monitoring.rs"
required-features = ["server"]

[[bin]]
name = "dashboard-direct"
path = "src/direct.rs"
required-features = ["direct"]

[[bin]]
name = "canvas-pack"
path = "src/canvas_pack.rs"
required-features = ["canvas"]

[[bin]]
name = "canvas-server"
path = "src/canvas_server.rs"
required-features = ["canvas", "server"]

[[bin]]
name = "canvas-native"
path = "src/canvas_native.rs"
required-features = ["canvas", "host-sync"]

[[bin]]
name = "canvas-adapter-bench"
path = "src/canvas_adapter_bench.rs"
required-features = ["canvas", "host-sync"]

[[bin]]
name = "session-bootstrap"
path = "src/session_bootstrap.rs"
required-features = ["host-sync"]

# SPDX-License-Identifier: Apache-2.0
[package]
name = "otrios-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["dep:sdl2", "dep:ureq"]
server = ["dep:tiny_http"]

[dependencies]
otrios-core = { path = "../otrios-core", features = ["dashboard"] }
otrios-interfaces = { path = "../otrios-interfaces" }

wasm-bindgen = "=0.2.129"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { version = "=0.38.0", optional = true }
ureq = { version = "=3.4.2", default-features = false, optional = true }
tiny_http = { version = "=0.12.0", optional = true }

[[bin]]
name = "dashboard-server"
path = "src/server.rs"
required-features = ["server"]

[[bin]]
name = "dashboard-native"
path = "src/native.rs"
required-features = ["native"]

[lints]
workspace = true

services:
  module-host:
    image: otrios-dashboard-module:2.11.7
    build: .
    container_name: otrios-dashboard-module
    restart: unless-stopped
    ports:
      - "127.0.0.1:8877:8080"
    environment:
      OTRIOS_PUBLIC_UPSTREAM: host.docker.internal:8878
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    user: "${OTRIOS_MODULE_UID:-1000}:${OTRIOS_MODULE_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./index.html:/srv/bootstrap/index.html:ro
      - modules:/srv/modules:ro
volumes:
  modules:
    name: otrios-dashboard-modules
    external: true

<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTriOS</title><body style="font:18px system-ui;background:#101c29;color:#e9f4ff;padding:2rem">
<p id="status">Loading the signed OTriOS dashboard module…</p>
<script>
fetch('/release', {cache:'no-store',credentials:'same-origin'}).then(r=>{
  if(!r.ok)throw Error('Module release unavailable');return r.json();
}).then(release=>{
  if(!/^[0-9a-f]{64}$/.test(release.id) || release.web_entry!==`/releases/${release.id}/web/index.html`)throw Error('Invalid module release');
  location.replace(release.web_entry+(location.hash||'#/home'));
}).catch(()=>{document.getElementById('status').textContent='The dashboard module is temporarily unavailable. Please reload.';});
</script></body></html>

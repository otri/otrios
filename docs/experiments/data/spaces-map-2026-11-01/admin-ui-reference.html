        if(m.type==='app-info'||m.type==='data-info'){m.ghost=m.type==='data-info';const a=settingItem(m),s=space(m.space),t=catalog.find(t=>t.kind===a.kind);head=`<input class="sm-setting-name" value="${esc(a.name)}" aria-label="App name" data-setting-app="${a.id}" data-owner="${s.id}" data-is-ghost="${m.ghost}" maxlength="60" ${!canEdit(s)?'readonly':''}><p class="sm-bundle-id">${esc(bundleId(a))}${m.ghost?' · data':''}</p>`;body=`${stats(a.data.bytes,m.ghost?0:(a.active||[]).length)}${!m.ghost?`<div class="sm-info-row"><span>App size</span><span>${bytes(t.code)}</span></div><div class="sm-info-row"><span>Version</span><span>0.1</span></div>`:''}<div class="sm-info-row"><span>Space</span><span>${esc(s.name)}</span></div>${canEdit(s)?`<hr class="sm-settings-divider"><div class="sm-info-actions">${m.ghost?button('Restore App','restore-app',`data-space="${s.id}" data-id="${a.id}"`,'sm-text'):button('Share App','share-app',`data-space="${s.id}" data-id="${a.id}"`,'sm-text')}${button('Export Data','export-data',`data-space="${s.id}" data-id="${a.id}" data-is-ghost="${m.ghost}"`,'sm-text')}${button('Replace Data','replace-data',`data-space="${s.id}" data-id="${a.id}" data-is-ghost="${m.ghost}"`,'sm-text')}</div>`:''}${m.notice?`<p class="sm-detail" role="status">${esc(m.notice)}</p>`:''}<div class="sm-dialog-actions">${close}</div>`;}
        if(m.type==='share-app'){const a=app(m.space,m.id);title='Share App';body=`<p>${esc(a.name)}</p><p class="sm-bundle-id">${esc(bundleId(a))}</p><div class="sm-field"><input readonly class="sm-share-url" aria-label="Shared app URL" value="${esc(shareUrl(a))}"></div><p class="sm-detail">Anyone with the link can download the app. Data is excluded.</p><div class="sm-dialog-actions">${close}${button('Open page','download-page','', 'sm-primary')}</div>`;}
        if(m.type==='replace-data'){title='Replace Data';const a=settingItem(m);body=`<p>${esc(a.name)}</p><div class="sm-upload-drop" data-drop-kind="data"><p>${m.file?esc(m.file.name):'Drop a data payload'}</p>${m.file?`<p class="sm-detail">${bytes(m.file.size)}</p>`:''}${button('Choose File','choose-data','','sm-text')}<input type="file" accept=".otdata" data-data-file hidden aria-label="Data payload"></div>${m.file?`<p class="sm-detail">Current data will be kept as a backup.${space(m.space).access!=='private'?' Replacement data will be public.':''}</p>`:''}${m.notice?`<p class="sm-detail" role="status">${esc(m.notice)}</p>`:''}<div class="sm-dialog-actions">${cancel}${button('Replace','preview-replace',m.file?'':'disabled','sm-primary')}</div>`;}
        if(m.type==='add-app'){title='Add App';body=`<div class="sm-catalog">${button('<span class="sm-icon sm-upload-icon" aria-hidden="true"><i data-lucide="upload"></i></span><span>Upload</span>','upload-app',`data-space="${m.space}"`,'sm-launch')}${catalog.map(t=>button(`${icon(t.kind)}<span>${t.name}</span>`,'install-app',`data-kind="${t.kind}"`,'sm-launch')).join('')}</div><div class="sm-dialog-actions">${cancel}</div>`;}
        if(m.type==='upload-app'){title='Upload App';body=`<div class="sm-upload-drop" data-drop-kind="app"><p>${m.file?esc(m.file.name):'Drop an app payload or shared URL'}</p>${m.file?`<p class="sm-detail">${bytes(m.file.size)}</p>`:''}${button('Choose File','choose-app','','sm-text')}<input type="file" accept=".zip,.otapp" data-app-file hidden aria-label="App payload"></div><form data-form="upload-url"><input name="url" type="url" aria-label="Shared app URL" placeholder="Shared app URL" value="${esc(m.url||'')}"><div class="sm-dialog-actions">${cancel}<button type="submit" class="sm-primary cursor-interaction">Continue</button></div></form>${m.staged?`<div class="sm-upload-summary"><p>${esc(m.staged.name)}</p><p class="sm-bundle-id">${esc(m.staged.bundleId)}</p></div>`:''}${m.notice?`<p class="sm-detail" role="status">${esc(m.notice)}</p>`:''}`;}
        if(m.type==='get-otrios'){title='Host your own';body=`<p>Get the source and follow the hosting guide.</p><div class="sm-host-links"><a href="https://github.com/otri/otrios" target="_blank" rel="noopener noreferrer">Get OTriOS ↗</a><a href="https://github.com/otri/otrios/blob/main/docs/FRAME_HOSTING.md" target="_blank" rel="noopener noreferrer">Hosting guide ↗</a></div><p class="sm-detail">Then open a Space, choose + → Upload, and paste the shared app URL.</p><div class="sm-dialog-actions">${close}</div>`;}
        if(m.type==='add-space'){title='New Space';body=`<form data-form="new-space"><input name="name" aria-label="Space name" placeholder="Space name" maxlength="60" required autofocus><div class="sm-dialog-actions">${cancel}<button type="submit" class="sm-primary cursor-interaction">Add</button></div></form>`;}
        if(m.type==='access'){title='People & access';body=`<form data-form="access"><div class="sm-field"><label for="rf-access">Access</label><select id="rf-access" name="access"><option value="private" ${m.draft.access==='private'?'selected':''}>Private</option><option value="read" ${m.draft.access==='read'?'selected':''}>Public · Read only</option><option value="comment" ${m.draft.access==='comment'?'selected':''}>Public · Signed-in comments</option></select></div><hr class="sm-settings-divider">${m.draft.members.map((p,i)=>`<div class="sm-person"><span>${esc(p.name)}</span><select data-member-role="${i}" aria-label="Role for ${esc(p.name)}"><option ${p.role==='Member'?'selected':''}>Member</option><option ${p.role==='Admin'?'selected':''}>Admin</option></select>${button('−','remove-member',`data-index="${i}" aria-label="Remove ${esc(p.name)}"`,'sm-round')}</div>`).join('')}<div class="sm-add-person"><input data-new-person placeholder="Email or username" aria-label="Person to add">${button('+','add-member','aria-label="Add person"','sm-round')}</div><div class="sm-dialog-actions">${cancel}<button type="submit" class="sm-primary cursor-interaction">Save</button></div></form>`;}
        if(m.type==='access-review'){title='Change access?';body=`<p>${m.draft.access==='private'?'Only members will be able to enter.':m.draft.access==='read'?'Anyone will be able to read this Space.':'Anyone will be able to read. Signed-in visitors can comment.'}</p><p class="sm-detail">Applies to ${esc(space(m.space).name)}.</p>${actions('Apply','apply-access')}`;}
        if(m.type==='delete-app'){title='Delete App';body=`<p>${esc(app(m.space,m.id).name)}</p><div class="sm-delete-footer"><label class="sm-check"><input type="checkbox" data-remove-data>Remove Data</label><div class="sm-dialog-actions">${cancel}${button('Delete','confirm-delete-app','','sm-danger')}</div></div>`;}
        if(m.type==='delete-data'){title='Delete Data';body=`<p>${esc(ghost(m.space,m.id).name)}</p><p class="sm-detail">This permanently removes its saved data.</p>${actions('Delete','confirm-delete-data','sm-danger')}`;}
        if(m.type==='delete-space'){title='Delete Space';body=`<p>${esc(space(m.space).name)}</p><div class="sm-delete-footer"><label class="sm-check"><input type="checkbox" data-remove-data>Remove Data</label><div class="sm-dialog-actions">${cancel}${button('Delete','confirm-delete-space','','sm-danger')}</div></div>`;}
        if(m.type==='move'){const a=m.ghost?ghost(m.source,m.id):app(m.source,m.id);title='Move '+a.name+(m.ghost?' data?':'?');body=`<div class="sm-move-route"><span class="sm-route-tag">${esc(space(m.source).name)}</span><span>→</span><span class="sm-route-tag">${esc(space(m.target).name)}</span></div>${!m.ghost?['both','app','data'].map((mode,i)=>`<div class="sm-radio-row"><input type="radio" id="rf-move-${mode}" name="move-mode" value="${mode}" ${m.mode===mode?'checked':''}><label for="rf-move-${mode}">${['App and data','App only','Data only'][i]}</label></div>`).join(''):''}<p class="sm-detail" data-move-detail>${moveDetail(m)}</p>${actions('Move','confirm-move')}`;}
        if(m.type==='profile'){title=state.profile;body=`<div class="sm-profile-actions">${button('Edit profile','edit-profile','','sm-text')}${button('Deleted Spaces','deleted-spaces','','sm-text')}${button('Sign out','signout','','sm-text')}</div><div class="sm-dialog-actions">${close}</div>`;}
        if(m.type==='edit-profile'){title='Profile';body=`<form data-form="profile"><input name="name" aria-label="Display name" value="${esc(state.profile)}" required><div class="sm-dialog-actions">${cancel}<button type="submit" class="sm-primary cursor-interaction">Save</button></div></form>`;}
        if(m.type==='deleted-spaces'){title='Deleted Spaces';body=state.deletedSpaces.length?state.deletedSpaces.map(s=>`<div class="sm-trash-row"><span>${esc(s.name)}</span>${button('Restore','restore-space',`data-id="${s.id}"`)}</div>`).join(''):'<p class="sm-detail">Nothing here.</p>';body+=`<div class="sm-dialog-actions">${close}</div>`;}
        return `<dialog aria-labelledby="rf-modal-title">${head?`<div id="rf-modal-title" class="sm-setting-heading">${head}</div>`:`<h2 id="rf-modal-title">${esc(title)}</h2>`}${body}${state.error?`<p class="sm-error" role="alert">${esc(state.error)}</p>`:''}</dialog>`;
      }
      function downloadPage(){const a=app(state.sharing.space,state.sharing.id);return `<div class="sm-download-page">${button('← Back','share-return','','sm-text sm-back')}${icon(a.kind)}<h1>${esc(a.name)}</h1><p class="sm-bundle-id">${esc(bundleId(a))}</p><div class="sm-download-action">${button('Download App','preview-download','','sm-primary')}</div><p class="sm-detail">On your OTriOS host, open a Space → + → Upload.</p><p class="sm-detail">Need your own host? ${button('Get OTriOS ↗','get-otrios','','sm-text')}</p>${state.status?`<p class="sm-status" role="status">${esc(state.status)}</p>`:''}</div>`;}
      function render(){applyDesign();if(!state.signed||!state.spaces.some(canEdit))state.editing=false;const isDownload=state.page==='download',footer=state.page==='map'&&state.signed&&state.spaces.some(canEdit)?`<footer class="sm-footer">${button(state.editing?'Done':'Edit','edit','',state.editing?'sm-primary':'sm-text')}</footer>`:'';shell.innerHTML=`<header class="sm-top">${button('OTriOS','map','','sm-text sm-brand')}${isDownload?button('Get OTriOS','get-otrios','','sm-text'):state.signed?button(`<span class="sm-avatar" aria-hidden="true">${esc(state.profile[0]||'A')}</span>`,'profile',`aria-label="Profile: ${esc(state.profile)}"`,'sm-text sm-profile'):button('Sign in','signin','','sm-text')}</header><main>${isDownload?downloadPage():state.page==='app'?appView():state.page==='space'?`<div class="sm-app-view">${button('← Spaces','map','','sm-text sm-back')}<h1>${esc(space(state.space).name)}</h1><div class="sm-apps" style="margin-top:26px">${space(state.space).apps.map(a=>tile(space(state.space),a)).join('')}</div></div>`:map()}<span class="sm-sr" data-key-status role="status" aria-live="polite"></span></main>${footer}${dialogMarkup()}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});const d=shell.querySelector('dialog');if(d){d.addEventListener('cancel',e=>{e.preventDefault();closeModal();});d.showModal();shell.style.minHeight=Math.max(690,Math.ceil(d.offsetHeight+125))+'px';}else shell.style.minHeight='';if(focusAfter&&!d){shell.querySelector(focusAfter)?.focus();focusAfter=null;}}
      function stageUrl(value){const m=state.modal;try{const url=new URL(value);if(url.protocol!=='https:')throw Error('Use an HTTPS app link.');const match=url.pathname.match(/^\/apps\/([a-z0-9][a-z0-9-]{0,63})\/([a-f0-9]{64})\/?$/);if(!match)throw Error('Use a shared app URL with its bundle hash.');const t=catalog.find(t=>bundleId(t)===match[1]);m.url=url.href;m.staged={name:t?.name||match[1],bundleId:match[1]};m.notice='Preview only — fetching and signature verification are not implemented.';state.error='';}catch(error){state.error=error.message;m.staged=null;m.notice='';}render();}
      function stageFile(file,kind){if(!file)return;const sid=state.modal.space,id=state.modal.id,isGhost=state.modal.ghost;state.modal={type:kind==='app'?'upload-app':'replace-data',space:sid,id,ghost:isGhost,file:{name:file.name,size:file.size}};if(kind==='app')state.modal.notice='Preview only — payload verification and installation are not implemented.';state.error='';render();}
      root.addEventListener('input',event=>{const t=event.target;if(t.dataset.settingApp){const a=t.dataset.isGhost==='true'?ghost(t.dataset.owner,t.dataset.settingApp):app(t.dataset.owner,t.dataset.settingApp);if(a&&canEdit(space(t.dataset.owner))){a.name=t.value;remember();}}if(t.dataset.settingSpace){const s=space(t.dataset.settingSpace);if(canEdit(s)){s.name=t.value;remember();}}});
      root.addEventListener('focusout',event=>{const t=event.target;if(t.dataset.settingApp){const a=t.dataset.isGhost==='true'?ghost(t.dataset.owner,t.dataset.settingApp):app(t.dataset.owner,t.dataset.settingApp);if(a)a.name=a.name.trim()||catalog.find(c=>c.kind===a.kind).name;}if(t.dataset.settingSpace){const s=space(t.dataset.settingSpace);s.name=s.name.trim()||'Untitled Space';}});
      root.addEventListener('click',event=>{const t=event.target.closest('[data-action]');if(!t)return;const action=t.dataset.action;const handled=['setting-color','share-app','export-data','replace-data','choose-data','choose-app','preview-replace','upload-app','download-page','share-return','get-otrios','preview-download'];if(!handled.includes(action))return;event.preventDefault();event.stopImmediatePropagation();
        if(action==='setting-color'){space(state.modal.space).color=t.dataset.color;render();remember();}
        if(action==='share-app')openModal('share-app',{space:t.dataset.space,id:t.dataset.id});
        if(action==='export-data'){const a=settingItem(state.modal);state.modal.notice='Export preview: '+a.name+'.otdata — no file was downloaded.';render();}
        if(action==='replace-data')openModal('replace-data',{space:t.dataset.space,id:t.dataset.id,ghost:t.dataset.isGhost==='true'});
        if(action==='choose-data')root.querySelector('[data-data-file]').click();
        if(action==='choose-app')root.querySelector('[data-app-file]').click();
        if(action==='preview-replace'){state.modal.notice='Replacement preview — current data is unchanged.';render();}
        if(action==='upload-app')openModal('upload-app',{space:t.dataset.space});
        if(action==='download-page'){state.sharing={space:state.modal.space,id:state.modal.id,returnPage:state.page};state.modal=null;state.page='download';state.status='';render();}
        if(action==='share-return'){state.page=state.sharing.returnPage;openModal('app-info',{space:state.sharing.space,id:state.sharing.id});}
        if(action==='get-otrios')openModal('get-otrios');
        if(action==='preview-download'){state.status='Download preview — no app payload was downloaded.';render();}
      },{capture:true});
      root.addEventListener('click',event=>{const t=event.target.closest('button[type="submit"]');if(t?.closest('form')?.dataset.form==='upload-url'){event.preventDefault();event.stopImmediatePropagation();const f=t.closest('form');if(f.reportValidity())stageUrl(f.elements.url.value.trim());}},{capture:true});
      root.addEventListener('submit',event=>{if(event.target.dataset.form==='upload-url'){event.preventDefault();event.stopImmediatePropagation();stageUrl(event.target.elements.url.value.trim());}},{capture:true});
      root.addEventListener('change',event=>{const t=event.target;if(t.hasAttribute('data-setting-color')){space(state.modal.space).color=t.value;root.querySelectorAll('[data-action="setting-color"]').forEach(b=>b.setAttribute('aria-pressed','false'));remember();}if(t.hasAttribute('data-app-file'))stageFile(t.files[0],'app');if(t.hasAttribute('data-data-file'))stageFile(t.files[0],'data');});
      root.addEventListener('dragover',event=>{if(['add-app','upload-app','replace-data'].includes(state.modal?.type)){event.preventDefault();root.querySelector('dialog')?.classList.add('sm-file-over');}});
      root.addEventListener('dragleave',event=>{if(!root.querySelector('dialog')?.contains(event.relatedTarget))root.querySelector('dialog')?.classList.remove('sm-file-over');});
      root.addEventListener('drop',event=>{if(!['add-app','upload-app','replace-data'].includes(state.modal?.type))return;event.preventDefault();root.querySelector('dialog')?.classList.remove('sm-file-over');const kind=state.modal.type==='replace-data'?'data':'app';if(event.dataTransfer.files.length){stageFile(event.dataTransfer.files[0],kind);return;}if(kind==='app'){const value=(event.dataTransfer.getData('text/uri-list').split('\n').find(line=>line&&!line.startsWith('#'))||event.dataTransfer.getData('text/plain')).trim();const sid=state.modal.space;state.modal={type:'upload-app',space:sid,url:value};stageUrl(value);}});
      let keyboardGrab=null;
      root.addEventListener('keydown',event=>{if(!state.editing||state.modal||event.target.matches('input,textarea,select'))return;const item=event.target.closest('.sm-item');if(!keyboardGrab&&event.code==='Space'&&item){event.preventDefault();event.stopImmediatePropagation();keyboardGrab={source:item.dataset.owner,id:item.dataset.item,ghost:item.dataset.ghost==='true',target:item.dataset.owner};root.querySelector('[data-key-status]').textContent='Picked up. Use arrow keys to choose a Space, Enter to drop, Escape to cancel.';item.classList.add('sm-drop-target');return;}if(!keyboardGrab)return;if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();keyboardGrab=null;root.querySelectorAll('.sm-drop-target').forEach(e=>e.classList.remove('sm-drop-target'));return;}if(event.key==='Enter'){event.preventDefault();event.stopImmediatePropagation();const move=keyboardGrab;keyboardGrab=null;root.querySelectorAll('.sm-drop-target').forEach(e=>e.classList.remove('sm-drop-target'));if(move.target!==move.source)prepareMove(move.source,move.id,move.target,move.ghost);return;}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();event.stopImmediatePropagation();const choices=state.spaces.filter(canEdit),index=choices.findIndex(s=>s.id===keyboardGrab.target),delta=['ArrowLeft','ArrowUp'].includes(event.key)?-1:1;keyboardGrab.target=choices[(index+delta+choices.length)%choices.length].id;root.querySelectorAll('.sm-drop-target').forEach(e=>e.classList.remove('sm-drop-target'));root.querySelector(`.sm-space[data-space="${keyboardGrab.target}"]`)?.classList.add('sm-drop-target');root.querySelector('[data-key-status]').textContent=space(keyboardGrab.target).name;}},{capture:true});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();remember();}});tweak.addSlider(design,'iconSize',{label:'App size',min:64,max:88,step:4,unit:'px'});tweak.addSlider(design,'spaceGap',{label:'Space spacing',min:16,max:36,step:4,unit:'px'});}
      window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(typeof next?.iconSize==='number')design.iconSize=next.iconSize;if(typeof next?.spaceGap==='number')design.spaceGap=next.spaceGap;applyDesign();});
    })();
  </script>

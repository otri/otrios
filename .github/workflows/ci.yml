# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Rust checks on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and run checks
        run: bash scripts/cloud-install.sh

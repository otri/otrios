# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Rust checks on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned Rust and run checks
        run: bash scripts/cloud-install.sh

  dashboard-hosts:
    name: Native GLES2 and Wasm hosts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native display dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev xvfb libgl1-mesa-dri libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev
      - name: Prepare pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Check all host adapters
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check distributed module handoff
        run: node --test scripts/test-dashboard-release-gate.mjs
      - name: Compile browser module
        run: cargo build -p otrios-dashboard --lib --release --locked --target wasm32-unknown-unknown
      - name: Compile native module
        run: cargo build -p otrios-dashboard --features native --bin dashboard-native --release --locked
      - name: Test the native state-worker boundary
        run: cargo test -p otrios-dashboard --features native --bin dashboard-native --locked
      - name: Exercise native GLES2 under Mesa
        run: |
          xvfb-run -a env SDL_RENDER_DRIVER=opengles2 LIBGL_ALWAYS_SOFTWARE=1 target/release/dashboard-native --frames 1
          xvfb-run -a env SDL_RENDER_DRIVER=opengles2 LIBGL_ALWAYS_SOFTWARE=1 target/release/dashboard-native --screen 3d --objects 64 --load-hz 30 --frames 12 --report /tmp/otrios-3d.json
      - name: Compile the owned Linux display host
        run: cargo build -p otrios-dashboard --features direct --bin dashboard-direct --release --locked
      - name: Check retained GPU geometry and pixel output
        run: |
          cargo test -p otrios-linux-display --features platform --locked
          env EGL_PLATFORM=surfaceless LIBGL_ALWAYS_SOFTWARE=1 cargo test -p otrios-linux-display --features platform --locked -- --ignored
